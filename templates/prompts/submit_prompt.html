{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-white relative">

    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,_rgba(139,92,246,0.12),_transparent_35%),radial-gradient(circle_at_bottom_right,_rgba(6,182,212,0.08),_transparent_35%)] pointer-events-none"></div>

    <div class="relative z-10">

        {% include 'components/navbar.html' %}

        <section class="max-w-3xl mx-auto px-6 py-16">

            <h1 class="text-5xl font-black mb-6">
                Submit a Prompt
            </h1>

            <p class="text-slate-300 text-lg mb-10">
                Share your best AI prompt with the Promptfy community.
            </p>

            <form method="POST" class="space-y-6 rounded-3xl border border-white/10 bg-white/5 backdrop-blur-2xl p-10 shadow-2xl">
                {% csrf_token %}

                {% for field in form %}
                    <div>
                        <label class="block mb-3 text-slate-300 font-medium">
                            {{ field.label }}
                        </label>

                        {{ field }}
                    </div>
                {% endfor %}

                <button
                    type="submit"
                    class="w-full px-6 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-cyan-500 text-white font-semibold hover:scale-[1.02] transition"
                >
                    Submit Prompt
                </button>
            </form>

        </section>
    </div>
</div>
{% endblock %}
