<section class="max-w-7xl mx-auto px-6 py-20">

    <div class="flex justify-between items-center mb-12">
        <h2 class="text-3xl md:text-5xl font-black">✨ Latest Prompts</h2>

        <a href="/prompts/" class="text-cyan-300 hover:text-cyan-200 transition font-medium">
            Explore all →
        </a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">

        {% for prompt in latest_prompts %}
        <div class="{% if forloop.counter > 4 %}hidden md:block{% endif %}">
            <a href="/prompts/{{ prompt.slug }}/"
               class="block rounded-3xl border border-white/10 bg-white/5 backdrop-blur-2xl p-6 md:p-8 hover:scale-105 transition duration-300 shadow-2xl">

                <div class="flex justify-between items-center mb-6">
                    <span class="px-4 py-2 rounded-full bg-cyan-500/20 text-cyan-200 text-sm">
                        {{ prompt.category.name }}
                    </span>

                    <span class="text-slate-400">
                        👁 {{ prompt.views }}
                    </span>
                </div>

                <h3 class="text-2xl md:text-3xl font-bold mb-4 hover:text-cyan-300 transition">
                    {{ prompt.title }}
                </h3>

                <p class="text-slate-300 leading-relaxed">
                    {{ prompt.description|truncatechars:100 }}
                </p>

                <button
                    onclick="event.preventDefault(); copyPrompt(`{{ prompt.prompt_text|escapejs }}`)"
                    class="mt-8 w-full px-6 py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-cyan-500 text-white font-semibold hover:scale-[1.02] transition">
                    Copy Prompt
                </button>

            </a>
        </div>

        {% empty %}
        <p class="text-slate-400">No latest prompts yet.</p>
        {% endfor %}

    </div>
</section>
