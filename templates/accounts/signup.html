{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-slate-950 flex items-center justify-center px-4">

    <div class="w-full max-w-sm">

        <!-- Branding -->
        <div class="text-center mb-6">
            <a href="/" class="text-2xl font-black bg-gradient-to-r from-purple-300 via-white to-cyan-300 bg-clip-text text-transparent">
                Promptfy
            </a>

            <h1 class="mt-3 text-xl font-bold text-white">
                Create Account
            </h1>

            <p class="mt-1 text-slate-400 text-sm">
                Build your AI prompt vault
            </p>
        </div>

        <!-- Card -->
        <div class="bg-slate-900 border border-white/10 rounded-2xl shadow-2xl p-6">

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm text-slate-300 mb-1">
                        Username
                    </label>
                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        required
                        class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:border-cyan-400"
                    >
                </div>

                <div>
                    <label class="block text-sm text-slate-300 mb-1">
                        Password
                    </label>
                    <input
                        type="password"
                        name="password1"
                        placeholder="Password"
                        required
                        class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:border-cyan-400"
                    >
                </div>

                <div>
                    <label class="block text-sm text-slate-300 mb-1">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        name="password2"
                        placeholder="Confirm Password"
                        required
                        class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:border-cyan-400"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full py-2.5 rounded-xl bg-gradient-to-r from-purple-500 to-cyan-500 text-white font-semibold">
                    Create Account
                </button>
            </form>

            <div class="flex items-center gap-3 my-4">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="text-slate-500 text-xs">OR</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <a href="/accounts/google/login/"
               class="block w-full text-center py-2.5 rounded-xl border border-white/10 bg-white text-slate-900 text-sm font-medium hover:bg-slate-100 transition">

                <span class="inline-flex items-center gap-2">
                    <img
                        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                        width="16"
                        height="16"
                        alt="Google"
                    >
                    Continue with Google
                </span>
            </a>

        </div>

        <p class="mt-5 text-center text-sm text-slate-400">
            Already have an account?
            <a href="/accounts/login/" class="text-cyan-300 hover:text-cyan-200">
                Login
            </a>
        </p>

    </div>

</div>
{% endblock %}
